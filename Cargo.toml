[workspace.dependencies]
# Patched floors for the October 2026 RustSec advisories. Keep legacy zstd
# decoders disabled consistently across server, tests, and benchmark crates.
zstd = { version = "0.14.3", default-features = false }
wasmtime = { version = "48.0.8", default-features = false, features = ["cranelift", "runtime", "std"] }

[workspace.package]
edition = "2021"
publish = false

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

# check.sh crate tests (land tier): dev + opt-level 1. Keeps debug_assertions/overflow checks (the
# #[cfg(debug_assertions)] test seams) but the differential tests stop crawling at opt-level 0.
[profile.check-test]
inherits = "dev"
opt-level = 1
# stack-depth tests calibrated to opt-level 0 frame sizes (at opt 1 the depth-8000 probe no longer reaches the
# stack limit: "PROBE OK" instead of 54001, box 27 ctab 10-02) stay at opt-level 0
[profile.check-test.package.adt_tsquery_core]
opt-level = 0
[profile.check-test.package.ltree]
opt-level = 0
# D4477: the planning context's allocator (mcx, its debug-only FreedSet's hashbrown, allocator-api2's Vec) at opt-level
# 3 in crate tests, debug_assertions kept: at opt-level 1 each plan-time allocation cost several times malloc
[profile.check-test.package.mcx]
opt-level = 3
[profile.check-test.package.hashbrown]
opt-level = 3
[profile.check-test.package.allocator-api2]
opt-level = 3

# Iterate on fast-profile (no LTO tail); numbers only from release/dist.
[profile.fast-profile]
inherits = "release"
lto = false
codegen-units = 16
# regression: keep the symbol table (release strips it) so the
# perf-profile ladder legs symbolize. ELF-sections-only — codegen unchanged.
strip = false

[profile.release]
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 1

# Optimized wasm artifact for the web demo (wasm). NATIVE-INERT:
# nothing native selects this profile; only wasm/wasm-build.sh's optional
# PGRUST_WASM_PROFILE=wasm-release leg uses it. opt-level=3 for speed, like
# native; size is no longer the first goal (D4462: opt s ran 1.35-2x slower
# on every workload; opt 3 costs +9 % code / gzip). Symbols stripped, no LTO.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16

# The release artifact.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# dist codegen with symbols kept — for perf attribution only, never a reported number's binary.
[profile.dist-prof]
inherits = "dist"
strip = false
debug = 1

[profile.profiling]
inherits = "release"
debug = 1
strip = false

# libmimalloc-sys 0.1.49 (mimalloc v3.3.2) as published, vendored so its Linux decommit can avoid one MADV_DONTNEED over a
# whole 2 MiB-aligned range (CVE-2026-74674: Linux 7.0 reclaims the PTE table under such a call and flushes the wrong
# address). The change is in c_src/mimalloc/v3/src/prim/unix/prim.c (_mi_prim_decommit).
# Second vendored change (C3, memacct2 2026-10-15): c_src/mimalloc/v3/src/arena.c + include/mimalloc.h export
# mi_arena_purge_now(arena_id, force), one arena's freed ranges purged now under the arenas' purge try-guard (pgrust's
# cache arena; every other arena keeps the process-wide purge delay). Third (C3 purge owned), same
# files: mi_arena_set_purge_owned / mi_arena_purge_owned_fallbacks, the owned arena skipped by every other purge (a
# dead-man fallback after 1 s without its owner's purge). Fourth (REUSE BEFORE RELEASE), same
# files: mi_arena_set_reuse_donor / mi_arena_reuse_stats, a general heap's fresh page first takes the donor arena's
# committed free slices (mi_arena_try_reuse in mi_arenas_page_alloc_fresh_area, the marks cleared in _mi_arenas_free).
# Fifth (REUSE gate + purge after idle), same files: mi_arena_committed_free / mi_arena_reuse_self_stats (a general arena's
# own committed free run claimed before the donor's), mi_arena_reuse_cache_self_stats (the cache heap's new page claims
# the cache arena's committed free run before fresh slices), mi_arena_purge_after_idle (the owner purges an arena only once no
# slice was claimed from it for a while: a claim count in mi_arena_try_alloc_at and the reuse claim, kept only once the
# hold's first tick turned it on; mi_arena_claims_noted reads it) and
# mi_arena_purged_bytes (bytes purged by the owner vs every other caller, counted in mi_arena_purge).
# Sixth (pressure purge + purge timing), same files: mi_arena_purge_unused (decommit every free committed run now, whatever
# the purge delay), mi_arena_set_purge_phase / mi_arena_purge_batch / mi_arena_purge_times (each purge event's time by
# thread class: the owner, a session inside a statement, a session after its ReadyForQuery, an executor worker, other).
# Seventh (H3 step (2), give_back_service), same files: mi_arena_purge_now_busy, whether this thread's last
# mi_arena_purge_now returned at the purge try-guard (another thread held it), so a forced purge past the watchdog's cancel
# line hands the refused arena to the give-back service instead of losing it.
# Eighth (macfix 2026-10-21, macOS only): c_src/mimalloc/v3/src/prim/osx/alloc-override-zone.c gives the malloc zone's
# introspection table the `reinit_lock` hook a version >= 9 zone must have (libmalloc's fork child handler calls it
# unchecked; NULL crashed every fork() on macOS 26). The file is compiled only for Apple targets.
# A mimalloc bump ports all eight.
# allocator-api2 0.2.21 as published, vendored so its Vec grow path can carry std's inline attributes (one out-of-line grow
# per element type and one cold finish_grow per allocator, instead of the whole path inlined at every push / reserve site).
[patch.crates-io]
libmimalloc-sys = { path = "third_party/libmimalloc-sys" }
allocator-api2 = { path = "third_party/allocator-api2" }
