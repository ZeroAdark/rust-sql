[package]
name = "pgclient"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "pgclient"
path = "src/lib.rs"

[dependencies]
file_seams = { path = "../../backend/storage/file/file_seams" }
init_small = { path = "../../backend/utils/init/init_small" }
ip = { path = "../../common/ip" }
latch = { path = "../../backend/storage/ipc/latch" }
libc = "0.2"
mcx = { path = "../../_support/mcx" }
pg_clock = { path = "../../port/pg_clock" }
pg_prng = { path = "../../common/pg_prng" }
vfs = { path = "../../backend/storage/file/vfs" }
pg_b64 = { path = "../../common/base64" }
pg_string = { path = "../../common/string" }
pg_hmac = { path = "../../common/hmac" }
pg_md5 = { path = "../../common/md5" }
pg_strong_random = { path = "../../port/pg_strong_random" }
postgres_seams = { path = "../../backend/tcop/postgres_seams" }
saslprep = { path = "../../common/saslprep" }
scram_common = { path = "../../common/scram_common" }
timingsafe_bcmp = { path = "../../port/timingsafe_bcmp" }
types_core = { path = "../../_support/types/types_core" }
types_error = { path = "../../_support/types/types_error" }
types_storage = { path = "../../_support/types/types_storage" }
wchar = { path = "../../common/wchar" }

# Vendored OpenSSL does not build for wasm32; the wasm arm keeps the
# no-USE_SSL refusals (docs/design/wasm-crate-ledger.md).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = "0.9"
foreign-types = "0.3"

[dev-dependencies]
fd = { path = "../../backend/storage/file/fd" }
waitevent_seams = { path = "../../backend/utils/activity/waitevent_seams" }
waiteventset = { path = "../../backend/storage/ipc/waiteventset" }
