[package]
name = "be_secure_openssl"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "be_secure_openssl"
path = "src/lib.rs"

[dependencies]
be_secure_common = { path = "../be_secure_common" }
elog = { path = "../../utils/error/elog" }
fd = { path = "../../storage/file/fd" }
guc_tables = { path = "../../utils/misc/guc_tables" }
latch_seams = { path = "../../storage/ipc/latch_seams" }
mbutils = { path = "../../utils/mb/mbutils" }
mcx = { path = "../../../_support/mcx" }
pg_string = { path = "../../../common/string" }
postgres_seams = { path = "../../tcop/postgres_seams" }
pqcomm = { path = "../pqcomm" }
types_error = { path = "../../../_support/types/types_error" }
types_storage = { path = "../../../_support/types/types_storage" }
wchar = { path = "../../../common/wchar" }
libc = "0.2"
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = "0.9"
foreign-types = "0.3"

[build-dependencies]
# D4503: openssl-src's `no-dso` (no dynamic engine / module loading; engines are trimmed anyway). Feature
# unification applies it to openssl-sys's build-dependency, and the feature change is what makes cargo re-run
# openssl-sys's build script (and so pick up the OPENSSL_SRC_PERL trim) in target dirs built before it.
openssl-src = { version = "300.6", features = ["no-dso"] }

[dev-dependencies]
xact_seams = { path = "../../access/transam/xact_seams" }
