[package]
name = "memruntime"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "memruntime"
path = "src/lib.rs"

[dependencies]
pagegive = { path = "../../../_support/pagegive" }
backend_status = { path = "../../utils/activity/backend_status" }
mcx = { path = "../../../_support/mcx" }
mempolicy = { path = "../../../_support/mempolicy" }
# C3: decide's unattributed band reads the ledger's doors (memledger::doors_total).
memledger = { path = "../../../_support/memledger" }
# pagepool P2: the pool's threads start beside the watchdog (start)
pagepool = { path = "../../../_support/pagepool" }
# D4692: the page releaser drains the cache runs' landing stack (allocarena::own)
allocarena = { path = "../../../_support/allocarena" }
types_core = { path = "../../../_support/types/types_core" }
types_storage = { path = "../../../_support/types/types_storage" }
elog = { path = "../../utils/error/elog" }
localtime = { path = "../../timezone/localtime" }
types_error = { path = "../../../_support/types/types_error" }
guc_tables = { path = "../../utils/misc/guc_tables" }
lmgr_proc = { path = "../../storage/lmgr/lmgr_proc" }
procsignal = { path = "../../storage/ipc/procsignal" }
pgsync = { path = "../../../_support/pgsync" }
# D4812: memlog's drain deadline and its longest-write count
pg_clock = { path = "../../../port/pg_clock" }
libc = "0.2"

[dev-dependencies]
# the backstop's revoke rung test asks a live statement (mcx::revoke's registry is the std build's)
mcx = { path = "../../../_support/mcx", features = ["std"] }
# H3 step (2): tests/give_back_purge.rs runs the real global allocator wrapper over pgrust's arenas, as allocarena's tests do
init_small = { path = "../../utils/init/init_small" }
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended", "no_thp"] }
