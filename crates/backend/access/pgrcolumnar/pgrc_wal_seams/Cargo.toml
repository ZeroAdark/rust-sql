# Seams, not a dependency: pgrc_wal depends on pgrc_am, whose writers log through it.
[package]
name = "pgrc_wal_seams"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "pgrc_wal_seams"
path = "src/lib.rs"

[dependencies]
seam_core = { path = "../../../../_support/seam_core" }
pgrc_format = { path = "../pgrc_format" }
pgrc_write = { path = "../pgrc_write" }
types_core = { path = "../../../../_support/types/types_core" }
types_error = { path = "../../../../_support/types/types_error" }
types_rel = { path = "../../../../_support/types/rel" }
