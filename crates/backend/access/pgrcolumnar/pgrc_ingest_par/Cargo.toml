[package]
name = "pgrc_ingest_par"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "pgrc_ingest_par"
path = "src/lib.rs"

# The rtpool BINDING for pgrcolumnar parallel ingest (chunk M3-I). It sits
# ABOVE both the writer and the runtime: `pgrc_write` cannot depend on
# `runtime` (pgrc_am → pgrc_write is inside the table-AM cone since #473,
# and runtime's cone reaches tableam — the edge would be a cycle), so the
# engine lives there and the StreamSource/TaskSet driver lives here. The
# COPY surface reaches this crate from above (executor altitude), never from
# pgrc_am directly.
[dependencies]
pgrc_write = { path = "../pgrc_write" }
# D3922: the pool workers run the leader's chunks on its memory account.
memledger = { path = "../../../../_support/memledger" }
pgrc_format = { path = "../pgrc_format" }
runtime = { path = "../../../executor/runtime" }

[dev-dependencies]
libc = "0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
