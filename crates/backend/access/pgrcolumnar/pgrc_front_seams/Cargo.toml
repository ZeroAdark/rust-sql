# Seams, not a dependency: the companion catalog work sits above tableam, which calls pgrc_front.
[package]
name = "pgrc_front_seams"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "pgrc_front_seams"
path = "src/lib.rs"

[dependencies]
seam_core = { path = "../../../../_support/seam_core" }
mcx = { path = "../../../../_support/mcx" }
# IX1 L0: the statement deletion view seam names a generation and the scan's deletion filter.
pgrc_am = { path = "../pgrc_am" }
pgrc_format = { path = "../pgrc_format" }
pgrc_write = { path = "../pgrc_write" }
tableam_vocab = { path = "../../table/tableam_vocab" }
types_core = { path = "../../../../_support/types/types_core" }
types_error = { path = "../../../../_support/types/types_error" }
types_rel = { path = "../../../../_support/types/rel" }
types_snapshot = { path = "../../../../_support/types/snapshot" }
types_tuple = { path = "../../../../_support/types/types_tuple" }
