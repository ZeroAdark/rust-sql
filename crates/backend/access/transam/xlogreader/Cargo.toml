[package]
name = "xlogreader"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "xlogreader"
path = "src/lib.rs"

[dependencies]
mcx = { path = "../../../../_support/mcx" }
types_core = { path = "../../../../_support/types/types_core" }
types_error = { path = "../../../../_support/types/types_error" }
types_storage = { path = "../../../../_support/types/types_storage" }
crc32c = { path = "../../../../port/crc32c" }
pglz = { path = "../../../../common/pglz" }
lz4_flex = "0.11"
rmgr = { path = "../rmgr" }
xlogreader_seams = { path = "../xlogreader_seams" }
xlogutils = { path = "../xlogutils" }
bufmgr_seams = { path = "../../../storage/buffer/bufmgr_seams" }
pgstat_seams = { path = "../../../utils/activity/pgstat_seams" }
waitevent_seams = { path = "../../../utils/activity/waitevent_seams" }
guc_tables = { path = "../../../utils/misc/guc_tables" }
libc = "0.2"

# zstd links C (zstd-sys); on wasm the zstd arm is C's !USE_ZSTD branch.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
zstd = { version = "0.13", default-features = false }  # D4503: default features carry the pre-1.0 "legacy" frame decoders; every zstd dependent must keep them off

[dev-dependencies]
lz4_block = { path = "../../../../common/lz4_block" }
