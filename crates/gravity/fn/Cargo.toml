# pagepool P3 (PGRUST_POOL_GRAVITY=1): an operator arena's chunks from the page pool
pagepool = { path = "../../_support/pagepool" }
hashbrown = { version = "0.14", default-features = false, features = ["allocator-api2", "ahash", "inline-more"] }
