# tests/pool_op_arena_global.rs: PoolAlloc as the global allocator
pagepool = { path = "../../_support/pagepool", features = ["global"] }

# The integration tests (tests/*.rs). The files that can share one process are modules of ONE test binary,
# gravity_fn_suite (tests/gravity_fn_suite.rs: `#[path = "<stem>.rs"]` and `mod t_<stem>;` per file); ct runs it once
# per module and keys the results as the former targets <stem>. A NEW test file goes there, unless it cannot share a
# process with the others (tests/registered.rs's rule: a name of ct's serial tail; a #[global_allocator]; text naming
# process-wide or process-global state; a `pub static` that holds state; a seam set or another process-state call): then
# it gets a [[test]] entry here, named <stem>. autotests = false, and tests/registered.rs fails until the file is in
# exactly one of the two places.
[[test]]
name = "gravity_fn_suite"
path = "tests/gravity_fn_suite.rs"

[[test]]
name = "differential"
path = "tests/differential.rs"

[[test]]
name = "fresh_vs_scratch"
path = "tests/fresh_vs_scratch.rs"

[[test]]
name = "hostcall"
path = "tests/hostcall.rs"

[[test]]
name = "ledger2_op_arena"
path = "tests/ledger2_op_arena.rs"

[[test]]
name = "m5_e1_slot_bank"
path = "tests/m5_e1_slot_bank.rs"

[[test]]
