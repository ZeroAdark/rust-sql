# gravity_hosts's integration tests that need the whole server's startup registration (seams_init, which depends on
# gravity_exec, the backend and so on: above gravity_hosts). As hosts' own tests they made seams_init a dev-dependency of
# gravity_hosts, and cargo gives every dev-dependency to every test target of the package: hosts' lib unit tests and all
# 51 integration-test binaries recompiled on every edit to gravity_exec or anything else seams_init depends on (BD-11).
[package]
name = "gravity_hosts_it"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
test = false
doctest = false

