datum = { path = "../../_support/types/datum" }
fires = { path = "../../_support/fires" }
mcx = { path = "../../_support/mcx" }
types_core = { path = "../../_support/types/types_core" }
types_error = { path = "../../_support/types/types_error" }
types_nodes = { path = "../../_support/types/nodes" }
types_portal = { path = "../../_support/types/portal" }
types_tuple = { path = "../../_support/types/types_tuple" }
fmgr = { package = "types_fmgr", path = "../../_support/types/fmgr" }
fmgr_core = { path = "../../backend/utils/fmgr/fmgr_core" }
lsyscache = { path = "../../backend/utils/cache/lsyscache" }
typcache = { path = "../../backend/utils/cache/typcache" }
detoast_seams = { path = "../../backend/access/common/detoast_seams" }
nodes_core = { path = "../../backend/nodes/nodes_core" }
format_type = { path = "../../backend/utils/adt/format_type" }
syscache_seams = { path = "../../backend/utils/cache/syscache_seams" }
pg_enum_seams = { path = "../../backend/catalog/pg_enum_seams" }
aclchk_seams = { path = "../../backend/catalog/aclchk_seams" }
miscinit_seams = { path = "../../backend/utils/init/miscinit_seams" }
objectaccess = { path = "../../backend/catalog/objectaccess" }
adt_date = { path = "../../backend/utils/adt/adt_date" }
adt_timestamp = { path = "../../backend/utils/adt/adt_timestamp" }
dbcommands_seams = { path = "../../backend/commands/dbcommands_seams" }
init_small = { path = "../../backend/utils/init/init_small" }
namespace_seams = { path = "../../backend/catalog/namespace_seams" }
sequence_seams = { path = "../../backend/commands/sequence_seams" }
arrayfuncs = { path = "../../backend/utils/adt/arrayfuncs" }
arrayutils = { path = "../../backend/utils/adt/arrayutils" }
