expandedrecord_seams = { path = "../../backend/utils/adt/expandedrecord_seams" }
execexpr = { path = "../../backend/executor/execexpr" }
tupdesc = { path = "../../backend/access/common/tupdesc" }
adt_xml = { path = "../../backend/utils/adt/xml" }
exectuples = { path = "../../backend/executor/exectuples" }
types_slot = { path = "../../_support/types/types_slot" }
heaptuple = { path = "../../backend/access/common/heaptuple" }
adt_jsonpath_exec = { path = "../../backend/utils/adt/jsonpath_exec" }
adt_json = { path = "../../backend/utils/adt/json" }
