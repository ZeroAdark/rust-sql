[package]
name = "gravity_abi"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "gravity_abi"
path = "src/lib.rs"
doctest = false

[dependencies]
cost_profile = { path = "../../_support/cost_profile" }
# limits::exceeded raises PostgreSQL's 54000 as a PgError payload (C6 (e))
types_error = { path = "../../_support/types/types_error" }

[[bench]]
name = "hostcall"
harness = true

# The integration tests (tests/*.rs). The files that can share one process are modules of ONE test binary,
# gravity_abi_suite (tests/gravity_abi_suite.rs: `#[path = "<stem>.rs"]` and `mod t_<stem>;` per file); ct runs it once
# per module and keys the results as the former targets <stem>. A NEW test file goes there, unless it cannot share a
# process with the others (tests/registered.rs's rule: a name of ct's serial tail; a #[global_allocator]; text naming
# process-wide or process-global state; a `pub static` that holds state; a seam set or another process-state call): then
# it gets a [[test]] entry here, named <stem>. autotests = false, and tests/registered.rs fails until the file is in
# exactly one of the two places.
[[test]]
name = "gravity_abi_suite"
path = "tests/gravity_abi_suite.rs"

[[test]]
name = "breaker"
path = "tests/breaker.rs"

[[test]]
name = "unwind_pad"
path = "tests/unwind_pad.rs"
