gravity_parallel = { path = "../parallel" }
# D3902: the spill I/O chunk (cost::runtime::SPILL_IO_CHUNK)
gravity_program = { path = "../program" }
gravity_hosts = { path = "../hosts" }
runtime = { path = "../../backend/executor/runtime" }
spillset = { path = "../../backend/executor/spillset" }
mcx = { path = "../../_support/mcx" }
parallel = { path = "../../backend/access/transam/parallel" }
pgstat = { path = "../../backend/utils/activity/pgstat" }
instrument = { path = "../../backend/executor/instrument" }
transam_xlog = { path = "../../backend/access/transam/transam_xlog" }
bufmgr = { path = "../../backend/storage/buffer/bufmgr" }
fd = { path = "../../backend/storage/file/fd" }
xact = { path = "../../backend/access/transam/xact" }
init_small = { path = "../../backend/utils/init/init_small" }
waiter = { path = "../../backend/storage/ipc/waiter" }
pgsync = { path = "../../_support/pgsync" }
postgres_seams = { path = "../../backend/tcop/postgres_seams" }
