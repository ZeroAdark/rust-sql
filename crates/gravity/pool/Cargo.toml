lmgr_seams = { path = "../../backend/storage/lmgr/lmgr_seams" }
rls_seams = { path = "../../backend/utils/misc/rls_seams" }
pgstat_seams = { path = "../../backend/utils/activity/pgstat_seams" }
xact_seams = { path = "../../backend/access/transam/xact_seams" }
aclchk_seams = { path = "../../backend/catalog/aclchk_seams" }
