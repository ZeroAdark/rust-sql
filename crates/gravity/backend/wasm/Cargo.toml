[package]
name = "gravity_wasm"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "gravity_wasm"
path = "src/lib.rs"

[dependencies]
gravity_ir = { path = "../../ir" }
stack_depth_core = { path = "../../../backend/utils/misc/stack_depth_core" }
gravity_program = { path = "../../program" }
gravity_abi = { path = "../../abi" }
wasm-encoder = "0.259"

[dev-dependencies]
gravity_ir = { path = "../../ir", features = ["text-loader"] }
wasm-encoder = "0.259"
gravity_interp = { path = "../interp" }
gravity_decompose = { path = "../../decompose" }
gravity_expr = { path = "../../expr" }
gravity_fn = { path = "../../fn" }
gravity_kernels = { path = "../../kernels" }
gravity_backend = { path = ".." }
datum = { path = "../../../_support/types/datum" }
mcx = { path = "../../../_support/mcx" }
types_core = { path = "../../../_support/types/types_core" }
types_error = { path = "../../../_support/types/types_error" }
types_nodes = { path = "../../../_support/types/nodes" }
types_portal = { path = "../../../_support/types/portal" }
types_tuple = { path = "../../../_support/types/types_tuple" }
fmgr_core = { path = "../../../backend/utils/fmgr/fmgr_core" }
miscinit_seams = { path = "../../../backend/utils/init/miscinit_seams" }
aclchk_seams = { path = "../../../backend/catalog/aclchk_seams" }
syscache_seams = { path = "../../../backend/utils/cache/syscache_seams" }
namespace_seams = { path = "../../../backend/catalog/namespace_seams" }
postgres_seams = { path = "../../../backend/tcop/postgres_seams" }
relcache_seams = { path = "../../../backend/utils/cache/relcache_seams" }
pg_locale = { path = "../../../backend/utils/adt/pg_locale" }
mbutils = { path = "../../../backend/utils/mb/mbutils" }
regex_core = { path = "../../../backend/regex/regex_core" }
adt_regexp = { path = "../../../backend/utils/adt/regexp" }
gravity_dict = { path = "../../dict" }
wasmtime.workspace = true

# The integration tests (tests/*.rs). The files that can share one process are modules of ONE test binary,
# gravity_wasm_suite (tests/gravity_wasm_suite.rs: `#[path = "<stem>.rs"]` and `mod t_<stem>;` per file); ct runs it
# once per module and keys the results as the former targets <stem>. A NEW test file goes there, unless it cannot share
# a process with the others (tests/registered.rs's rule: a name of ct's serial tail; a #[global_allocator]; text naming
# process-wide or process-global state; a `pub static` that holds state; a seam set or another process-state call): then
# it gets a [[test]] entry here, named <stem>. autotests = false, and tests/registered.rs fails until the file is in
# exactly one of the two places.
[[test]]
name = "gravity_wasm_suite"
path = "tests/gravity_wasm_suite.rs"
