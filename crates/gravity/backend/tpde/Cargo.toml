[package]
name = "gravity_tpde"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "gravity_tpde"
path = "src/lib.rs"

[dependencies]
# C6 (d): the stop points and the compile wait read the interrupt facade (cancelpoll::interrupts::pending) directly
cancelpoll = { path = "../../../_support/cancelpoll" }
gravity_ir = { path = "../../ir" }
mcx = { path = "../../../_support/mcx" }
types_error = { path = "../../../_support/types/types_error" }
tpde_base = { path = "../../../tpde/base" }
tpde_core = { path = "../../../tpde/core" }
tpde_compiler = { path = "../../../tpde/compiler" }
tpde_assembler = { path = "../../../tpde/assembler" }
tpde_elf_mapper = { path = "../../../tpde/elf-mapper" }
tpde_util = { path = "../../../tpde/util" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
tpde_compiler_a64 = { path = "../../../tpde/compiler-a64" }
tpde_function_writer_a64 = { path = "../../../tpde/function-writer-a64" }
tpde_disarm = { path = "../../../tpde/disarm" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
tpde_compiler_x64 = { path = "../../../tpde/compiler-x64" }
tpde_function_writer_x64 = { path = "../../../tpde/function-writer-x64" }
tpde_fadec = { path = "../../../tpde/fadec" }

[dev-dependencies]
gravity_ir = { path = "../../ir", features = ["text-loader"] }
gravity_interp = { path = "../interp" }

# The integration tests (tests/*.rs). The files that can share one process are modules of ONE test binary,
# gravity_tpde_suite (tests/gravity_tpde_suite.rs: `#[path = "<stem>.rs"]` and `mod t_<stem>;` per file); ct runs it
# once per module and keys the results as the former targets <stem>. A NEW test file goes there, unless it cannot share
# a process with the others (tests/registered.rs's rule: a name of ct's serial tail; a #[global_allocator]; text naming
# process-wide or process-global state; a `pub static` that holds state; a seam set or another process-state call): then
# it gets a [[test]] entry here, named <stem>. autotests = false, and tests/registered.rs fails until the file is in
# exactly one of the two places.
[[test]]
name = "gravity_tpde_suite"
path = "tests/gravity_tpde_suite.rs"

[[test]]
name = "view_passes"
path = "tests/view_passes.rs"
