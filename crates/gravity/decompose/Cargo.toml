[package]
name = "gravity_decompose"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "gravity_decompose"
path = "src/lib.rs"

[dependencies]
# C7 runtime half: its leader-class thread-locals are declared through leader_tls!
leader_tls = { path = "../../_support/leader_tls" }
gravity_abi = { path = "../abi" }
gravity_program = { path = "../program" }
# D2458: shapecheck fire signal (user ruling 2026-10-02 06:10Z: a fire call at each optimization's admit point)
fires = { path = "../../_support/fires" }
allocator-api2 = { version = "0.2", default-features = false, features = ["alloc"] }
mcx = { path = "../../_support/mcx" }
order_key = { path = "../../_support/order_key" }
# B2-31: normalize retype's session-zone casts, lent once by exec (the sanctioned OnceLock)
pgsync = { path = "../../_support/pgsync" }
datum = { path = "../../_support/types/datum" }
types_core = { path = "../../_support/types/types_core" }
types_error = { path = "../../_support/types/types_error" }
types_nodes = { path = "../../_support/types/nodes" }
readfuncs = { path = "../../backend/nodes/readfuncs" }
nodes_core = { path = "../../backend/nodes/nodes_core" }
copyfuncs = { path = "../../backend/nodes/copyfuncs" }
# D3748: check_stack_depth at each level of decompose's own recursions (54001 as PostgreSQL's planner raises it)
stack_depth_core = { path = "../../backend/utils/misc/stack_depth_core" }

[dev-dependencies]
gravity_lint = { path = "../lint" }

# The integration tests (tests/*.rs). The files that can share one process are modules of ONE test binary,
# gravity_decompose_suite (tests/gravity_decompose_suite.rs: `#[path = "<stem>.rs"]` and `mod t_<stem>;` per file); ct
# runs it once per module and keys the results as the former targets <stem>. A NEW test file goes there, unless it
# cannot share a process with the others (tests/registered.rs's rule: a name of ct's serial tail; a #[global_allocator];
# text naming process-wide or process-global state; a `pub static` that holds state; a seam set or another process-state
# call): then it gets a [[test]] entry here, named <stem>. autotests = false, and tests/registered.rs fails until the
# file is in exactly one of the two places.
[[test]]
name = "gravity_decompose_suite"
path = "tests/gravity_decompose_suite.rs"

[[test]]
name = "core_census"
path = "tests/core_census.rs"

[[test]]
name = "core_regress_histogram"
path = "tests/core_regress_histogram.rs"

[[test]]
name = "core_zero_alloc"
path = "tests/core_zero_alloc.rs"

[[test]]
name = "normalize_rules"
path = "tests/normalize_rules.rs"
