# alloclint (lane alloclint 2026-10-14): the untracked-allocation detector's clippy config. Used ONLY through CLIPPY_CONF_DIR
# by crates/gravity/lint/alloclint/collect.sh on the Gravity crates of scope.tsv (--no-deps); no other crate reads it.
# reason = the inventory kind (type | method | growth | macro); see reports/ALLOCLINT-LOWERV4-20261014.md section 1.
avoid-breaking-exported-api = false

disallowed-types = [
  # no_std spellings (abi, dict, ir, backend/tpde are #![no_std]: a std:: path does not resolve there)
  { path = "alloc::vec::Vec", reason = "alloclint:type" },
  { path = "alloc::collections::VecDeque", reason = "alloclint:type" },
  { path = "alloc::collections::BinaryHeap", reason = "alloclint:type" },
