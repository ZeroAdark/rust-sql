[package]
name = "tpde_function_writer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0 WITH LLVM-exception"
autotests = false

[dependencies]
tpde_assembler = { path = "../assembler" }
tpde_core = { path = "../core" }
tpde_util = { path = "../util" }
tpde_base = { path = "../base", default-features = false }
mcx = { path = "../../_support/mcx" }
types_error = { path = "../../_support/types/types_error" }

[features]
upstream-oracle = []

[[test]]
name = "upstream"
required-features = ["upstream-oracle"]
