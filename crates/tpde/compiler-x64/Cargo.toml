[package]
name = "tpde_compiler_x64"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0 WITH LLVM-exception"
autotests = false

[dependencies]
tpde_compiler = { path = "../compiler" }
tpde_core = { path = "../core" }
tpde_function_writer = { path = "../function-writer" }
tpde_function_writer_x64 = { path = "../function-writer-x64" }
tpde_fadec = { path = "../fadec" }
tpde_assembler = { path = "../assembler" }
tpde_base = { path = "../base", default-features = false }
tpde_util = { path = "../util" }
mcx = { path = "../../_support/mcx" }
types_error = { path = "../../_support/types/types_error" }

[features]
upstream-oracle = []

[dev-dependencies]
tpde_test_ir = { path = "../test-ir" }

[[test]]
name = "reference_prepare"
required-features = ["upstream-oracle"]

[[test]]
name = "upstream"
required-features = ["upstream-oracle"]
