version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0 WITH LLVM-exception"
autotests = false

[dependencies]
tpde_function_writer = { path = "../function-writer" }
tpde_fadec = { path = "../fadec" }
tpde_core = { path = "../core" }
tpde_util = { path = "../util" }
