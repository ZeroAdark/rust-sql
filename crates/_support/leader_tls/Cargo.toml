[package]
name = "leader_tls"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "leader_tls"
path = "src/lib.rs"
doctest = false

[dependencies]
# the probe's once-set global (THE single lock library: lint-determinism rawsync)
pgsync = { path = "../pgsync" }
# a touch on a pool thread raises ERROR XX000 as a PgError payload (the claim's containment makes it the section's error)
types_error = { path = "../types/types_error" }
