[package]
name = "cancelpoll"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# D3887: the abort poll of a long host-side loop and the poll-gap probe. Near a leaf (pg_clock, and for the interrupt
# facade only PostgreSQL's interrupt seams and the error type), so the part reader, the dictionary hosts and the Gravity
# driver may all call it.
[dependencies]
pg_clock = { path = "../../port/pg_clock" }
pgsync = { path = "../pgsync" }
postgres_seams = { path = "../../backend/tcop/postgres_seams" }
types_error = { path = "../types/types_error" }
